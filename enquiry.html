    <div class="container-contact100">
        <div class="wrap-contact100" style="display: block">
            <a href="./index.html" class="contact100-btn-hide">
                <i class="fa fa-close" aria-hidden="true"></i>
            </a>

            <form id="enquiryform" class="contact100-form validate-form enquiryform" action="#">
                <span class="contact100-form-title">
                    Contact Us
                </span>

                <div class="form-group wrap-input100 rs1-wrap-input100 validate-input" data-validate="Name is required">
                    <span class="label-input100">Your Name</span>
                    <input class="input100" type="text" name="name" value="" title="Please Provide Your Name"
                        placeholder="Enter your name" required>
                    <span class="focus-input100"></span>
                </div>

                <div class="form-group wrap-input100 rs1-wrap-input100 validate-input"
                    data-validate="Valid email is required: ex@abc.xyz">
                    <span class="label-input100">Email</span>
                    <input id="enquiry-email" class="input100" type="email" name="email" value=""
                        title="Please Provide Email Id" placeholder="Enter your email addess" required>
                    <span class="focus-input100"></span>
                </div>

                <div class="form-group wrap-input100 rs1-wrap-input100 validate-input"
                    data-validate="Mobile Number is required">
                    <span class="label-input100">Mobile Number</span>
                    <input id="enq-moblnumber" class="input100" type="tel" minlength="10" maxlength="10" name="mobile"
                        title="Please Provide Mobile Number" placeholder="Enter your Mobile Number" required>
                    <span class="focus-input100"></span>
                </div>

                <div class="mbl-padding form-group wrap-input100 rs1-wrap-input100 validate-input"
                    data-validate="Mobile Number is required">
                    <span class="mbl-line-height label-input100">Professional Services</span>
                    <select id="professionalservices" type="input" value="" class="select-ready-to-invest"
                        onchange="renderServiceDropDowns(event);" required>
                        <option name="select" value="---Select---">---Select---</option>
                        <option name="service" value="I want to buy agricultural land / I want to invest">I want to buy
                            agricultural land / I want to invest</option>
                        <option name="product" value="I have my own agricultural land / I own farmland">I have my own
                            agricultural land / I own farmland</option>
                    </select>
                    <span class="focus-input100"></span>
                </div>


                <div id="service-dropdown-one"
                    class="mbl-padding form-group wrap-input100 rs1-wrap-input100 validate-input in-visible">

                </div>

                <div id="service-dropdown-two" style="margin-top: -27px;"
                    class="form-group wrap-input100 rs1-wrap-input100 validate-input in-visible">

                </div>

                <div id="location" class="form-group wrap-input100 rs1-wrap-input100 validate-input in-visible"
                    data-validate="Where is your agricultural land located? is required">

                </div>

                <div id="landinacres" class="form-group wrap-input100 rs1-wrap-input100 validate-input in-visible"
                    data-validate="How many acres of agricultural land do you own">

                </div>

                <div id="comments" class="form-group wrap-input100 rs1-wrap-input100 validate-input in-visible">

                </div>
                <div class="form-group container-contact100-form-btn">
                    <button type="button" name="submit" class="contact100-form-btn">
                        <span>
                            Submit
                            <i class="fa fa-long-arrow-right m-l-7" aria-hidden="true"></i>
                        </span>
                    </button>
                </div>
            </form>

           <!-- <p class="contact100-more">
